<style>
:root{--ink:#34424a;--sky:#a9dcec;--mint:#a8ddc8;--peach:#f6c98a;--pink:#f4a9bb;--lav:#cdb8ea;--coral:#e47f6d;--teal:#6aa897;--card:#fff1cf;
--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);
--font:"Fredoka","Noto Sans Thai Looped",ui-rounded,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky)}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);font-weight:600;touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
img{pointer-events:none;-webkit-user-drag:none}
button{font:inherit;color:inherit;cursor:pointer}
/* room backgrounds */
body{transition:background .4s;background-color:var(--sky)}
body[data-bg=home]{background:radial-gradient(ellipse 70% 30% at 20% 100%,#8fd0a8 99%,transparent 100%),radial-gradient(ellipse 80% 38% at 85% 105%,#79c19a 99%,transparent 100%),linear-gradient(#8fd0ea,#cdeef0)}
body[data-bg=bath]{background:linear-gradient(rgba(52,66,74,.13) 2px,transparent 2px) 0 0/64px 64px,linear-gradient(90deg,rgba(52,66,74,.13) 2px,transparent 2px) 0 0/64px 64px,#b7e3ee}
body[data-bg=bed]{background:repeating-linear-gradient(90deg,#d7c6ef 0 48px,#cbb7e8 48px 96px)}
body[data-bg=kitchen]{background:conic-gradient(#b5e3cf 25%,#a1d8c0 0 50%,#b5e3cf 0 75%,#a1d8c0 0) 0 0/96px 96px}
body[data-bg=living]{background:repeating-linear-gradient(0deg,#f6cf98 0 70px,#efc186 70px 74px)}
body[data-bg=garden]{background:radial-gradient(circle at 18% 18%,#ffe79a 0 44px,transparent 46px),linear-gradient(#8fd0ea 0 42%,#8ccf92 42% 100%)}
/* layout */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:calc(14px + var(--sat)) calc(16px + var(--sar)) calc(14px + var(--sab)) calc(16px + var(--sal));overflow:auto}
.screen.on{display:flex;animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.btn{border:3px solid var(--ink);background:var(--peach);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:10px 20px;font-size:clamp(16px,2.6vmin,22px);min-height:48px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:4px solid #fff;outline-offset:3px}
.btn.big{font-size:clamp(24px,5vmin,40px);padding:14px 44px;background:var(--coral);color:#fff;text-shadow:0 2px 0 var(--ink)}
.top{width:100%;max-width:1000px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.pill{display:flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:99px;background:var(--card);padding:4px 16px 4px 8px;font-size:clamp(18px,3vmin,26px)}
.pill img{width:clamp(28px,5vmin,40px)}
h1,h2{margin:0}
h2{font-size:clamp(24px,4.6vmin,38px);text-shadow:0 2px 0 rgba(255,255,255,.6)}
/* start */
#start{justify-content:center;gap:clamp(8px,2vh,22px);text-align:center;overflow:hidden}
#start .sun{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 38%,rgba(255,255,255,.22) 0 10deg,transparent 10deg 20deg);animation:spin 60s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{position:absolute;width:150px;height:46px;background:#eaf7fb;border:3px solid var(--ink);border-radius:99px;opacity:.95;animation:drift 18s linear infinite}
.cloud::before{content:"";position:absolute;left:26px;top:-28px;width:66px;height:54px;background:inherit;border:3px solid var(--ink);border-bottom:0;border-radius:50% 50% 0 0}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(calc(100vw + 200px))}}
.logo{position:relative;font-size:clamp(44px,11vmin,96px);line-height:1;color:var(--coral);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);letter-spacing:.02em}
.sub{position:relative;font-size:clamp(16px,3vmin,24px);background:var(--card);border:3px solid var(--ink);border-radius:99px;padding:4px 20px}
#start .mimi{position:relative;width:clamp(120px,30vmin,260px);animation:float 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 0 rgba(52,66,74,.25))}
@keyframes float{50%{transform:translateY(-14px) rotate(2deg)}}
.hint{position:relative;font-size:14px;opacity:.75}
/* cards grid */
.grid{width:100%;max-width:1000px;display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(130px,26vmin,200px),1fr));gap:clamp(10px,2vmin,20px);margin:auto 0}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px 12px;background:var(--card);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.card:hover{transform:translateY(-3px)}
.card:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.card:focus-visible{outline:4px solid #fff;outline-offset:3px}
.card img{width:clamp(72px,17vmin,120px);height:clamp(72px,17vmin,120px);object-fit:contain}
.card b{font-size:clamp(17px,3vmin,24px)}
.card .tick{position:absolute;top:-10px;right:-8px;width:40px;height:40px;border:3px solid var(--ink);border-radius:50%;background:var(--mint);display:none;place-items:center;font-size:22px}
.card.done .tick{display:grid}
.c0{background:#ffe3a8}.c1{background:#cfeaf6}.c2{background:#f9c6d3}.c3{background:#d9f0cf}.c4{background:#e3d5f6}
.guide{display:flex;align-items:flex-end;gap:10px;width:100%;max-width:1000px;margin-top:10px}
.guide img{width:clamp(64px,12vmin,100px)}
.bubble{background:var(--card);border:3px solid var(--ink);border-radius:22px 22px 22px 6px;padding:10px 16px;font-size:clamp(16px,2.8vmin,22px)}
/* activity */
.stage{width:100%;max-width:1000px;display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(12px,2.4vmin,24px);flex:1;min-height:0;align-items:center}
.now{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;background:var(--card);border:3px solid var(--ink);border-radius:30px;box-shadow:0 7px 0 var(--ink)}
.now .say{font-size:clamp(22px,4.4vmin,36px);text-align:center;line-height:1.2}
.tap{--p:0;position:relative;width:clamp(150px,34vmin,300px);aspect-ratio:1;border:0;border-radius:50%;padding:12%;background:conic-gradient(var(--teal) calc(var(--p)*1%),rgba(52,66,74,.15) 0);display:grid;place-items:center}
.tap::before{content:"";position:absolute;inset:7%;border-radius:50%;background:#fde9b8;border:3px solid var(--ink)}
.tap img{position:relative;width:100%;height:100%;object-fit:contain;animation:wob 1.6s ease-in-out infinite}
.tap.hit img{animation:hit .25s}
@keyframes wob{50%{transform:scale(1.06) rotate(-3deg)}}
@keyframes hit{50%{transform:scale(1.2) rotate(6deg)}}
.tap:focus-visible{outline:4px solid var(--ink);outline-offset:4px}
.tip{font-size:clamp(14px,2.2vmin,18px);opacity:.8}
.steps{display:flex;flex-direction:column;gap:clamp(6px,1.4vmin,12px);margin:0;padding:0;list-style:none}
.steps li{display:flex;align-items:center;gap:12px;padding:6px 14px 6px 8px;background:var(--card);border:3px solid var(--ink);border-radius:20px;font-size:clamp(16px,2.8vmin,22px);opacity:.75}
.steps li img{width:clamp(40px,8vmin,60px);height:clamp(40px,8vmin,60px);object-fit:contain;flex:none}
.steps li.cur{opacity:1;background:var(--peach);transform:scale(1.04);box-shadow:0 4px 0 var(--ink)}
.steps li.ok{background:var(--mint);opacity:1}
.steps li.ok::after{content:"✔";margin-left:auto;font-size:1.3em}
.bar{width:100%;max-width:1000px;height:14px;border:3px solid var(--ink);border-radius:99px;background:rgba(255,255,255,.5);overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;width:0;background:var(--coral);transition:width .3s}
/* win */
#win{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(52,66,74,.55)}
#win.on{display:grid}
.win{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 30px;background:var(--card);border:4px solid var(--ink);border-radius:32px;box-shadow:0 8px 0 var(--ink);text-align:center;animation:pop .4s;max-width:90vw}
.win img.m{width:clamp(110px,26vmin,220px);animation:float 1.6s ease-in-out infinite}
.win .st{display:flex;gap:6px}.win .st img{width:clamp(40px,8vmin,64px);animation:pop .5s backwards}
.win .st img:nth-child(2){animation-delay:.15s}.win .st img:nth-child(3){animation-delay:.3s}
.spark{position:fixed;width:16px;height:16px;border:2px solid var(--ink);border-radius:50%;pointer-events:none;z-index:50;animation:fly .8s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.tools{position:fixed;z-index:30;top:calc(10px + var(--sat));right:calc(10px + var(--sar));display:flex;gap:8px}
.tools button{width:46px;height:46px;min-height:0;padding:0;font-size:22px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
@media (max-aspect-ratio:1/1){.stage{grid-template-columns:1fr;align-content:start;overflow:auto}.tap{width:clamp(130px,30vh,260px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>

/* sound */
function beep(f,d=.12,t='sine'){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.12;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const jingle=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25,'triangle'),i*130));
/* nav */
function go(id,bg){$$('.screen').forEach(s=>s.classList.toggle('on',s.id===id));document.body.dataset.bg=bg||'home'}
function stars(){$('#stars').textContent=S.stars;$$('.sc').forEach(e=>e.textContent=S.stars)}
function sparks(x,y){for(let i=0;i<10;i++){const s=document.createElement('i');s.className='spark';s.style.cssText=`left:${x}px;top:${y}px;background:${['#ffd36a','#f4a9bb','#a8ddc8','#a9dcec'][i%4]};--x:${(Math.random()-.5)*220}px;--y:${(Math.random()-.9)*200}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}

 $('#steps').innerHTML=a.steps.map((s,i)=>`<li id="s${i}">${img(s[0])}<span>${s[1]}</span></li>`).join('');draw()}
function draw(){const a=act,cur=a.steps[step];$$('#steps li').forEach((li,i)=>li.className=i<step?'ok':i===step?'cur':'');
 $('#prog').style.width=(step/a.steps.length*100)+'%';$('#say').textContent=cur[1];$('#tapImg').src=IMG[cur[0]];
 $('#tap').style.setProperty('--p',taps/TAPS*100);$('#tip').textContent=`แตะที่รูป ${TAPS-taps} ครั้ง`;
 const li=$('#s'+step);li&&li.scrollIntoView({block:'nearest',behavior:'smooth'})}
$('#tap').onclick=e=>{const t=e.currentTarget;t.classList.remove('hit');void t.offsetWidth;t.classList.add('hit');
 const r=t.getBoundingClientRect();sparks(r.left+r.width/2,r.top+r.height/2);taps++;beep(440+taps*120);
 if(taps>=TAPS){taps=0;step++;S.stars++;save();stars();if(step>=act.steps.length)return finish();beep(784,.2,'triangle')}draw()};
function finish(){S.done[act.id]=true;save();$('#prog').style.width='100%';$$('#steps li').forEach(l=>l.className='ok');jingle();
 $('#winStars').innerHTML=img('star')+img('star')+img('star');$('#winTxt').textContent=`${act.name} เสร็จแล้ว! ได้ดาว ${act.steps.length} ดวง`;$('#win').classList.add('on')}
$('#again').onclick=()=>{$('#win').classList.remove('on');roomScreen(room)};
$('#back1').onclick=homeScreen;$('#back2').onclick=()=>roomScreen(room);
$('#play').onclick=()=>{beep(523);setTimeout(()=>beep(784),100);homeScreen()};
$('#snd').onclick=e=>{mute=!mute;e.currentTarget.textContent=mute?'🔇':'🔊'};
/* images */
$('#mimiStart').src=IMG.mimi_cheer;$('#mimiHome').src=IMG.mimi_ui;$('#mimiRoom').src=IMG.mimi_ui;$('#mimiWin').src=IMG.mimi_cheer;
$('#starIcon').src=IMG.star;$$('.si').forEach(i=>i.src=IMG.star);stars();
/* fullscreen + no zoom */
const rt=document.documentElement,rq=rt.requestFullscreen||rt.webkitRequestFullscreen,ex=document.exitFullscreen||document.webkitExitFullscreen;
if(!rq)$('#fs').style.display='none';
$('#fs').onclick=()=>{try{(document.fullscreenElement||document.webkitFullscreenElement)?ex.call(document):rq.call(rt)}catch(e){}};
['gesturestart','gesturechange','contextmenu','dblclick'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
</script>
