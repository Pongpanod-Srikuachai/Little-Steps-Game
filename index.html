<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#f6f3ec">
    <title>Little Steps</title>
    <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

    <style>
        :root { background:#f6f3ec; }
        * { box-sizing:border-box; }
        html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#f6f3ec; }
        body { position:fixed; inset:0; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
        #game-wrap { position:fixed; inset:0; width:100%; height:100%; overflow:hidden; background:#f6f3ec; }
        #canvas { display:block; width:100%; height:100%; outline:none; background:#f6f3ec; touch-action:none; }
        #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; background:#f6f3ec; color:#3c3c3c; font:600 18px system-ui,-apple-system,"Segoe UI",sans-serif; text-align:center; z-index:10; }
        #loading.hidden { display:none; }
        #loading-box { max-width:520px; line-height:1.5; }
        #loading-sub { margin-top:10px; font-size:14px; font-weight:500; color:#666; }
        #loading-actions { margin-top:20px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
        #loading-actions button, #loading-actions a { border:0; border-radius:10px; padding:11px 16px; font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif; text-decoration:none; cursor:pointer; background:#333; color:white; }
        #loading-actions a { background:#777; }
        @media (orientation: portrait) and (max-width: 800px) { #loading { font-size:16px; } #loading-sub { font-size:13px; } }
    </style>
</head>
<body>
    <div id="game-wrap">
        <canvas id="canvas" tabindex="0"></canvas>
    </div>

    <div id="loading">
        <div id="loading-box">
            <div id="loading-text">Loading Little Steps…</div>
            <div id="loading-sub">กำลังโหลดเกม กรุณารอสักครู่</div>
            <div id="loading-actions" hidden>
                <button id="reload-btn" type="button">Refresh</button>
                <a id="browser-btn" href="#" target="_blank" rel="noopener">เปิดใน Safari / Chrome</a>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
    <script>
        (function () {
            var canvas = document.getElementById("canvas");
            var wrap = document.getElementById("game-wrap");
            var loading = document.getElementById("loading");
            var loadingText = document.getElementById("loading-text");
            var loadingSub = document.getElementById("loading-sub");
            var actions = document.getElementById("loading-actions");
            var reloadBtn = document.getElementById("reload-btn");
            var browserBtn = document.getElementById("browser-btn");
            var engine;
            var started = false;

            function syncViewport() {
                var vv = window.visualViewport;
                var w = Math.max(1, Math.round(vv ? vv.width : window.innerWidth));
                var h = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));
                wrap.style.width = w + "px";
                wrap.style.height = h + "px";
                canvas.style.width = w + "px";
                canvas.style.height = h + "px";
            }

            function showError(title, detail) {
                loading.classList.remove("hidden");
                loadingText.textContent = title;
                loadingSub.innerHTML = detail;
                actions.hidden = false;
            }

            function isMessengerBrowser() {
                var ua = navigator.userAgent || "";
                return /FBAN|FBAV|Messenger/i.test(ua);
            }

            reloadBtn.addEventListener("click", function () {
                window.location.reload();
            });
            browserBtn.href = window.location.href;

            syncViewport();
            window.addEventListener("resize", syncViewport, { passive: true });
            window.addEventListener("orientationchange", function () {
                setTimeout(syncViewport, 250);
            }, { passive: true });
            if (window.visualViewport) {
                window.visualViewport.addEventListener("resize", syncViewport, { passive: true });
            }

            // Give a useful message instead of leaving the user on an endless loading screen.
            var timeout = setTimeout(function () {
                if (!started) {
                    if (isMessengerBrowser()) {
                        showError(
                            "เกมยังเปิดไม่สำเร็จใน Messenger",
                            "ตัวเปิดเว็บใน Messenger อาจไม่รองรับ WebGL/WASM ที่เกม Godot ต้องใช้<br><br>กด <b>…</b> ด้านบน แล้วเลือก <b>Open in Browser / เปิดในเบราว์เซอร์</b> จากนั้นเปิดด้วย Safari หรือ Chrome"
                        );
                    } else {
                        showError(
                            "Little Steps โหลดไม่สำเร็จ",
                            "ตรวจสอบอินเทอร์เน็ต แล้วลอง Refresh อีกครั้ง<br>ถ้ายังไม่ได้ ให้ลอง Safari/Chrome เวอร์ชันล่าสุด"
                        );
                    }
                }
            }, 12000);

            // Basic feature check before starting the 38 MB WebAssembly game.
            var testCanvas = document.createElement("canvas");
            var webgl2 = !!(testCanvas.getContext && testCanvas.getContext("webgl2"));
            if (!window.WebAssembly || !window.fetch || !webgl2) {
                clearTimeout(timeout);
                showError(
                    "เบราว์เซอร์นี้ไม่รองรับเกม",
                    "Little Steps ต้องใช้ WebAssembly + WebGL 2<br>กรุณาเปิดด้วย Safari หรือ Chrome รุ่นปัจจุบัน"
                );
                return;
            }

            try {
                engine = new Engine({
                    "args": [],
                    "canvasResizePolicy": 2,
                    "emscriptenPoolSize": 8,
                    "ensureCrossOriginIsolationHeaders": false,
                    "executable": "index",
                    "experimentalVK": false,
                    "fileSizes": {"index.pck": 5771976, "index.wasm": 37902138},
                    "focusCanvas": true,
                    "gdextensionLibs": [],
                    "godotPoolSize": 4
                });

                engine.startGame({
                    canvas: canvas,
                    canvasResizePolicy: 2,
                    focusCanvasOnStart: true,
                    experimentalVK: false
                }).then(function () {
                    started = true;
                    clearTimeout(timeout);
                    loading.classList.add("hidden");
                    canvas.focus();
                }).catch(function (err) {
                    clearTimeout(timeout);
                    console.error("Little Steps start error:", err);
                    showError(
                        "Little Steps โหลดไม่สำเร็จ",
                        "เกมไม่สามารถเริ่มในเบราว์เซอร์นี้ได้<br>ถ้าเปิดจาก Messenger ให้เลือก <b>Open in Browser</b> แล้วลอง Safari/Chrome"
                    );
                });
            } catch (err) {
                clearTimeout(timeout);
                console.error("Little Steps init error:", err);
                showError(
                    "Little Steps โหลดไม่สำเร็จ",
                    "ลอง Refresh หรือเปิดเกมด้วย Safari/Chrome"
                );
            }
        })();
    </script>
</body>
</html>
