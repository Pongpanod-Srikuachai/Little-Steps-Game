<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#f6f3ec">
    <title>$GODOT_PROJECT_NAME</title>
    $GODOT_HEAD_INCLUDE
    <style>
        :root { background:#f6f3ec; }
        * { box-sizing:border-box; }
        html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#f6f3ec; }
        body { position:fixed; inset:0; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
        #game-wrap { position:fixed; inset:0; width:100%; height:100%; overflow:hidden; background:#f6f3ec; }
        #canvas { display:block; width:100%; height:100%; outline:none; background:#f6f3ec; touch-action:none; }
        #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; background:#f6f3ec; color:#3c3c3c; font:600 18px system-ui,-apple-system,"Segoe UI",sans-serif; text-align:center; z-index:10; }
        #loading.hidden { display:none; }
        @media (orientation: portrait) and (max-width: 800px) { #loading { font-size:16px; } }
    </style>
</head>
<body>
    <div id="game-wrap">
        <canvas id="canvas" tabindex="0"></canvas>
    </div>
    <div id="loading">Loading Little Steps…</div>
    <script src="$GODOT_URL"></script>
    <script>
        (function () {
            var canvas = document.getElementById("canvas");
            var wrap = document.getElementById("game-wrap");
            var loading = document.getElementById("loading");
            var engine;

            function syncViewport() {
                var vv = window.visualViewport;
                var w = Math.max(1, Math.round(vv ? vv.width : window.innerWidth));
                var h = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));
                wrap.style.width = w + "px";
                wrap.style.height = h + "px";
                canvas.style.width = w + "px";
                canvas.style.height = h + "px";
            }

            function showError(message) {
                loading.classList.remove("hidden");
                loading.innerHTML = message;
            }

            syncViewport();
            window.addEventListener("resize", syncViewport, { passive:true });
            window.addEventListener("orientationchange", function () { setTimeout(syncViewport, 250); }, { passive:true });
            if (window.visualViewport) window.visualViewport.addEventListener("resize", syncViewport, { passive:true });

            try {
                engine = new Engine($GODOT_CONFIG);
                engine.startGame({
                    canvas: canvas,
                    canvasResizePolicy: 2,
                    focusCanvasOnStart: true,
                    experimentalVK: false
                }).then(function () {
                    loading.classList.add("hidden");
                }).catch(function (err) {
                    console.error(err);
                    showError("Little Steps โหลดไม่สำเร็จ<br><small>ลอง Refresh หรือเปิด Chrome/Safari เวอร์ชันล่าสุด</small>");
                });
            } catch (err) {
                console.error(err);
                showError("Little Steps โหลดไม่สำเร็จ<br><small>ลอง Refresh หรือเปิด Chrome/Safari เวอร์ชันล่าสุด</small>");
            }
        })();
    </script>
</body>
</html>
