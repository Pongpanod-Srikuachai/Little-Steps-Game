<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#f6f3ec">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Little Steps</title>
    <style>
        :root { background: #f6f3ec; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #f6f3ec;
        }
        body {
            position: fixed;
            inset: 0;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        #game-wrap {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            min-height: 100%;
            overflow: hidden;
            background: #f6f3ec;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
            background: #f6f3ec;
            touch-action: none;
        }
        @supports not (height: 100dvh) {
            #game-wrap { height: 100vh; }
        }
    </style>
    <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
    <div id="game-wrap">
        <canvas id="canvas" tabindex="0"></canvas>
    </div>
    <script src="index.js"></script>
    <script>
        const canvas = document.getElementById("canvas");
        const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":5771832,"index.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});

        // Keep the game canvas tied to the browser viewport on desktop and mobile.
        function syncViewport() {
            const wrap = document.getElementById("game-wrap");
            const w = Math.max(1, window.visualViewport ? window.visualViewport.width : window.innerWidth);
            const h = Math.max(1, window.visualViewport ? window.visualViewport.height : window.innerHeight);
            wrap.style.width = w + "px";
            wrap.style.height = h + "px";
        }

        window.addEventListener("resize", syncViewport, { passive: true });
        window.addEventListener("orientationchange", () => setTimeout(syncViewport, 150), { passive: true });
        if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", syncViewport, { passive: true });
        }
        syncViewport();

        engine.startGame({
            canvas: canvas,
            canvasResizePolicy: 2,
            focusCanvasOnStart: true
        });
    </script>
</body>
</html>
